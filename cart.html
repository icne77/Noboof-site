<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

</head>
<body>

  <!-- CUSTOM CURSOR -->

  <div class="cursor-follower"></div>

  <!-- NAVIGATION -->
  <nav>
    <a href="index.html" class="nav-logo">NOBOOF</a>
    <ul class="nav-links">
      <li><a href="shop.html">Shop</a></li>
      <li><a href="lookbook.html">Lookbook</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li>
        <a href="cart.html" class="cart-btn">
          Cart <span class="cart-count" style="display:none">0</span>
        </a>
      </li>
    </ul>
    <button class="nav-toggle" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- MOBILE MENU -->
  <div class="mobile-menu">
    <a href="shop.html">Shop</a>
    <a href="lookbook.html">Lookbook</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="cart.html">Cart</a>
  </div>

  <!-- PAGE HERO -->
  <div class="page-hero" style="height:30vh">
    <h1 class="page-hero-title">Your Cart</h1>
  </div>

  <!-- CART LAYOUT -->
  <div class="cart-layout" id="cart-wrapper">
    <!-- Rendered by renderCart() -->
  </div>

  <!-- STRIPE EMBEDDED CHECKOUT CONTAINER -->
  <div id="stripe-checkout-wrapper" style="display:none; padding: 0 80px 120px;">
    <div id="stripe-checkout-container">
      <div class="checkout-section-label">Checkout</div>
      <div id="stripe-checkout"></div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer>
    <div class="footer-grid">
      <div>
        <div class="footer-brand-name">NOBOOF</div>
        <p class="footer-brand-desc">Luxury streetwear from Los Angeles.</p>
      </div>
      <div>
        <div class="footer-col-title">Shop</div>
        <ul class="footer-links">
          <li><a href="shop.html">All Products</a></li>
        </ul>
      </div>
      <div>
        <div class="footer-col-title">Info</div>
        <ul class="footer-links">
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </div>
      <div>
        <div class="footer-col-title">Legal</div>
        <ul class="footer-links">
          <li><a href="#">Returns</a></li>
          <li><a href="#">Privacy Policy</a></li>
        </ul>
      </div>
    </div>
    <div class="footer-bottom">
      <span class="footer-copy">© 2025 NOBOOF. Los Angeles.</span>
      <div class="footer-gold-line"></div>
    </div>
  </footer>

  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script>
    /* ────────────────────────────────────────
       CART PAGE RENDERER
    ──────────────────────────────────────── */

    function formatPrice(cents) {
      return '$' + (cents / 1).toFixed(2).replace(/\.00$/, '');
    }

    function renderCart() {
      const items = Cart.get();
      const wrapper = document.getElementById('cart-wrapper');
      const { subtotal, count } = Cart.totals();
      const shipping = subtotal > 0 ? (subtotal >= 150 ? 0 : 12) : 0;
      const total = subtotal + shipping;

      if (items.length === 0) {
        wrapper.innerHTML = `
          <div class="cart-empty" style="grid-column:1/-1">
            <div class="cart-empty-icon">◻</div>
            <div class="cart-empty-text">Your Cart Is Empty</div>
            <div class="cart-empty-sub">Explore the collection</div>
            <a href="shop.html" class="btn-primary" style="margin-top:16px">Shop Now</a>
          </div>
        `;
        document.getElementById('stripe-checkout-wrapper').style.display = 'none';
        return;
      }

      // Build items HTML
      const itemsHTML = items.map(item => `
        <div class="cart-item" data-key="${item.key}">
          <div class="cart-item-img">
            <img src="${item.image}" alt="${item.name}"
              onerror="this.parentElement.style.background='#1a1a1a'; this.style.display='none';" />
          </div>
          <div>
            <div class="cart-item-name">${item.name.toUpperCase()}</div>
            <div class="cart-item-meta">
              ${item.size !== 'OS' ? 'SIZE: ' + item.size + ' · ' : ''}UNIT PRICE: $${item.price}
            </div>
            <div class="cart-qty-control">
              <button class="cart-qty-btn" onclick="Cart.updateQty('${item.key}', ${item.quantity - 1})">−</button>
              <div class="cart-qty-display">${item.quantity}</div>
              <button class="cart-qty-btn" onclick="Cart.updateQty('${item.key}', ${item.quantity + 1})">+</button>
            </div>
            <button class="cart-remove-btn" onclick="Cart.remove('${item.key}')">Remove</button>
          </div>
          <div class="cart-item-price">$${(item.price * item.quantity).toFixed(2).replace(/\.00$/, '')}</div>
        </div>
      `).join('');

      wrapper.innerHTML = `
        <div class="cart-items-section">
          <div class="cart-section-title">Order Summary</div>
          <div class="cart-item-count">${count} ${count === 1 ? 'ITEM' : 'ITEMS'}</div>
          ${itemsHTML}
        </div>

        <div class="cart-summary">
          <div class="cart-summary-title">Total</div>
          <div class="summary-line">
            <span>SUBTOTAL</span>
            <span>$${subtotal.toFixed(2).replace(/\.00$/, '')}</span>
          </div>
          <div class="summary-line">
            <span>SHIPPING</span>
            <span>${shipping === 0 ? 'FREE' : '$' + shipping}</span>
          </div>
          ${shipping > 0 ? `<div class="summary-line" style="font-size:11px; opacity:0.5">
            <span>Free shipping over $150</span>
            <span></span>
          </div>` : ''}
          <div class="summary-total">
            <span>Total</span>
            <span>$${total.toFixed(2).replace(/\.00$/, '')}</span>
          </div>
          <button class="checkout-btn" onclick="initiateCheckout()">
            Proceed to Checkout
          </button>
          <div class="cart-notes">
            Secure checkout · Powered by Stripe<br>
            Free shipping on orders over $150
          </div>
        </div>
      `;
    }

    /* ────────────────────────────────────────
       STRIPE CHECKOUT INITIATION
       
       HOW TO CONNECT STRIPE:
       1. Create products in your Stripe Dashboard (stripe.com)
       2. Copy each product's Price ID (starts with price_...)
       3. Replace 'price_REPLACE_ME' in your product cards with real IDs
       4. Deploy a Cloudflare Function at /functions/create-checkout.js
          (see README.md for full instructions)
    ──────────────────────────────────────── */
    async function initiateCheckout() {
      const items = Cart.get();
      if (!items.length) return;

      const btn = document.querySelector('.checkout-btn');
      btn.textContent = 'LOADING...';
      btn.disabled = true;

      try {
        // ── OPTION A: Stripe Payment Links (simplest, no backend needed)
        // Replace the URL below with your Stripe Payment Link URL
        // Create one at: dashboard.stripe.com/payment-links
        // window.location.href = 'https://buy.stripe.com/YOUR_PAYMENT_LINK_HERE';

        // ── OPTION B: Cloudflare Function (embedded checkout, stays on site)
        // Uncomment below once you deploy your Cloudflare Function:
        /*
        const response = await fetch('/functions/create-checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            items: items.map(i => ({
              price: i.stripePriceId,
              quantity: i.quantity
            })),
            success_url: window.location.origin + '/success.html',
            cancel_url: window.location.href
          })
        });
        const { clientSecret } = await response.json();

        const stripe = Stripe('pk_live_YOUR_PUBLISHABLE_KEY_HERE');
        const checkout = await stripe.initEmbeddedCheckout({ clientSecret });
        
        document.getElementById('stripe-checkout-wrapper').style.display = 'block';
        checkout.mount('#stripe-checkout');
        document.getElementById('stripe-checkout-wrapper').scrollIntoView({ behavior: 'smooth' });
        */

        // ── PLACEHOLDER (shows message until Stripe is configured)
        document.getElementById('stripe-checkout-wrapper').style.display = 'block';
        document.getElementById('stripe-checkout').innerHTML = `
          <div style="padding:40px; text-align:center; border:1px solid rgba(184,150,90,0.2);">
            <div style="font-family:'Bebas Neue',sans-serif; font-size:28px; letter-spacing:0.1em; margin-bottom:16px;">
              STRIPE NOT YET CONFIGURED
            </div>
            <p style="font-size:13px; color:rgba(255,255,255,0.4); line-height:1.8; max-width:400px; margin:0 auto;">
              Add your Stripe Payment Link or deploy your Cloudflare Function.<br>
              See the comments in cart.html for full setup instructions.
            </p>
          </div>
        `;
        document.getElementById('stripe-checkout-wrapper').scrollIntoView({ behavior: 'smooth' });

        btn.textContent = 'PROCEED TO CHECKOUT';
        btn.disabled = false;

      } catch (err) {
        console.error('Checkout error:', err);
        btn.textContent = 'ERROR — TRY AGAIN';
        btn.disabled = false;
        btn.style.background = '#ff4444';
        setTimeout(() => {
          btn.textContent = 'PROCEED TO CHECKOUT';
          btn.style.background = '';
        }, 3000);
      }
    }

    // Initial render
    renderCart();
  </script>
</body>
</html>
