<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOBOOF | Los Angeles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css" />
  <script src="https://js.stripe.com/v3/"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <nav>
    <div class="logo">NOBOOF</div>
    <div class="nav-links">
      <a href="#products">Products</a>
      <button id="cartToggle" class="nav-button" type="button">Cart (<span id="cartCount">0</span>)</button>
    </div>
  </nav>

  <main>
    <section class="hero">
      <div class="hero-content">
        <h1>NOBOOF</h1>
        <h2>LOS ANGELES</h2>
      </div>
    </section>

    <section class="section section-minimal" id="products">
      <div class="product-grid" id="productGrid"></div>
    </section>

    <section class="coordinates">
      <h2>NOBOOF</h2>
      <p>LOS ANGELES • 34.0522° N • 118.2437° W</p>
    </section>
  </main>

  <footer>
    NOBOOF © 2026 — LOS ANGELES
  </footer>

  <aside class="cart-drawer" id="cartDrawer" aria-hidden="true">
    <div class="cart-header">
      <h3>Shopping Bag</h3>
      <button id="cartClose" type="button" aria-label="Close cart">×</button>
    </div>

    <div id="cartItems" class="cart-items"></div>

    <div class="cart-summary">
      <div class="cart-row">
        <span>Subtotal</span>
        <strong id="cartSubtotal">$0.00</strong>
      </div>

      <button id="checkoutBtn" class="checkout-btn" type="button">Checkout</button>
      <div id="checkoutMount"></div>
    </div>
  </aside>
</body>
</html>
